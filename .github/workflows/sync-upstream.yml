name: Sync upstream odysseus and redeploy

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  DOKPLOY_URL: https://dokploy.hacksubset.com
  # Compose service "odysseus-compose" in project odysseus / production.
  DOKPLOY_COMPOSE_ID: mPAAYf4-0ZMc6OHw_ePU4

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: sync
        run: |
          set -euo pipefail
          git config user.name "odysseus-sync-bot"
          git config user.email "odysseus-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/odysseus-dev/odysseus.git
          git fetch --no-tags upstream main
          upstream="$(git rev-parse FETCH_HEAD)"
          echo "upstream=$upstream"
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit "$upstream"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push merged main
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Trigger Dokploy rebuild
        if: steps.sync.outputs.changed == 'true'
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" -X POST "$DOKPLOY_URL/api/compose.deploy" -H "x-api-key: $DOKPLOY_API_KEY" -H "Content-Type: application/json" -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}")
          echo "Dokploy compose deploy HTTP $code"
          cat /tmp/deploy.json || true
          test "$code" -lt 400
